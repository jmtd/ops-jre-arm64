name: Build ARM64 JRE Package (Nanos)

on:
  workflow_dispatch:

env:
  VERSION: 25.0.1
  PACKAGE_BASENAME: SemeruJREarm64Linux
  JRE_DIR: jdk-25.0.1+8-jre
  JRE_URL: https://github.com/ibmruntimes/semeru25-binaries/releases/download/jdk-25.0.1%2B8_openj9-0.56.0/ibm-semeru-open-jre_aarch64_linux_25.0.1_8_openj9-0.56.0.tar.gz

jobs:
  build-arm64-package:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure apt repositories for multi-arch
        run: |
          # limit existing mirrors to native architecture
          export NATIVE_ARCH="$(dpkg --print-architecture)"
          sudo sed -i "s/^Types/Architectures: $NATIVE_ARCH\nTypes/" /etc/apt/sources.list.d/ubuntu.sources

          # add appropriate arm64 mirror
          sudo tee >/etc/apt/sources.list.d/arm64.sources <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: noble noble-updates noble-backports noble-security
          Components: main
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Architectures: arm64
          EOF

      - name: Install system utilities
        run: |
          sudo dpkg --add-architecture arm64
          sudo apt-get update
          sudo apt-get install -y wget tar

      - name: Install ops (NanoVMs)
        run: |
          curl -L https://ops.city/get.sh | sh

      - name: Add ops to PATH
        run: |
          echo "$HOME/.ops/bin" >> $GITHUB_PATH

      - name: Verify ops installation
        run: |
          ops version

      # ============================
      # Build package root directory
      # ============================
      - name: Prepare package root
        run: |
          export PKG_NAME=${PACKAGE_BASENAME}_${VERSION}
          mkdir -p ${PKG_NAME}/sysroot
          export WORK=${PKG_NAME}/sysroot

          set -e
          sudo apt-get install -y -qq {libc6,libstdc++6,zlib1g}:arm64
          mkdir -p "$WORK"/lib "$WORK"/lib64 "$WORK"/usr/lib/aarch64-linux-gnu

          # ----------------------------
          # Populate Linux ARM64 sysroot
          # ----------------------------
          cp /lib/ld-linux-aarch64.so.1 "$WORK"/lib/
          cp /lib/ld-linux-aarch64.so.1 "$WORK"/lib64/
          cd /lib/aarch64-linux-gnu
          cp libc.so.6 \
             libm.so.6 \
             libpthread.so.0 \
             libdl.so.2 \
             librt.so.1 \
             libgcc_s.so.1 \
             libstdc++.so.6 \
             libz.so.1 \
             "$WORK/usr/lib/aarch64-linux-gnu/"

          # ----------------------------
          # Install Semeru JRE in sysroot
          # ----------------------------
          cd ${PKG_NAME}/sysroot
          wget -O jre.tar.gz ${JRE_URL}
          mkdir -p ${JRE_DIR}
          tar -xzf jre.tar.gz --strip-components=1 -C ${JRE_DIR}
          rm jre.tar.gz
          cd ../..

      # ============================
      # package.manifest (JSON)
      # ============================
      - name: Create package.manifest
        run: |
          export PKG_NAME=${PACKAGE_BASENAME}_${VERSION}
          cat > ${PKG_NAME}/package.manifest <<EOF
          {
            "Program": "/${JRE_DIR}/bin/java",
            "Args": ["java"],
            "Env": {
              "JAVA_HOME": "/${JRE_DIR}"
            },
            "Version": "${VERSION}"
          }
          EOF

      - name: Create README
        run: |
          export PKG_NAME=${PACKAGE_BASENAME}_${VERSION}
          echo "Semeru JRE ${VERSION} aarch64 Linux package for Nanos VM" > ${PKG_NAME}/README.md

      # ============================
      # Test (disabled by design)
      # ============================
      - name: Test package with ops (minimal)
        if: false
        run: |
          ops pkg load SemeruJREarm64Linux_${VERSION}

      # ============================
      # Create tarball
      # ============================
      - name: Create tarball & checksum
        run: |
          export PKG_NAME=${PACKAGE_BASENAME}_${VERSION}
          tar czf ${PKG_NAME}.tar.gz ${PKG_NAME}
          sha256sum ${PKG_NAME}.tar.gz > ${PKG_NAME}.tar.gz.sha256
          cat ${PKG_NAME}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SemeruJREarm64Linux_${{ env.VERSION }}
          path: |
            SemeruJREarm64Linux_${{ env.VERSION }}.tar.gz
            SemeruJREarm64Linux_${{ env.VERSION }}.tar.gz.sha256
          retention-days: 30
